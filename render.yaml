services:
  - type: web
    name: hemeley-backend
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: CORS_ORIGINS
        value: "*"
      - key: DB_NAME
        value: hemeley
      - key: JWT_SECRET
        value: hemeley_jwt_secret_2024_douala_street_food
      - key: MONGO_URL
        sync: false
